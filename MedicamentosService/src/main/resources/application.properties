spring.application.name=medicamentos

# Puerto propio, distinto del servicio principal (8080).
server.port=8081

# Los errores de la API nunca incluyen trazas de pila, mensajes internos
# ni nombres de excepciones en la respuesta (solo van al log del servidor).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# MEDICAMENTOS_API_KEY: clave compartida con PachocloSystem. Si tiene valor, /api/**
# exige la cabecera X-Api-Key con esa clave (401 si falta o no coincide). Vacía =
# sin autenticación de servicio (solo desarrollo). Ver README.
medicamentos.api-key=${MEDICAMENTOS_API_KEY:}

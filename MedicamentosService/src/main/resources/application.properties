spring.application.name=medicamentos

# PORT: puerto HTTP (lo asigna la plataforma de despliegue). Por defecto, 8081:
# distinto del servicio principal (8080).
server.port=${PORT:8081}

# Los errores de la API nunca incluyen trazas de pila, mensajes internos
# ni nombres de excepciones en la respuesta (solo van al log del servidor).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Zona horaria oficial de la aplicación ("hoy" para vencidos y por vencer),
# independiente de la del servidor. APP_ZONA_HORARIA: identificador
# IANA. Por defecto: America/Bogota. Una zona inválida impide arrancar.
app.zona-horaria=${APP_ZONA_HORARIA:America/Bogota}

# MEDICAMENTOS_API_KEY: clave compartida con PachocloSystem. Si tiene valor, /api/**
# exige la cabecera X-Api-Key con esa clave (401 si falta o no coincide). Vacía =
# sin autenticación de servicio (solo desarrollo). Ver README.
medicamentos.api-key=${MEDICAMENTOS_API_KEY:}

# Idempotencia de las salidas de stock (cabecera Idempotency-Key, ver README): cuánto
# tiempo se recuerda cada clave. Las caducadas se borran de la base al registrar salidas.
medicamentos.idempotencia.caducidad=24h

# PostgreSQL (ver README, sección "Base de datos"). Sin contraseña por defecto en el repo.
# MEDICAMENTOS_DB_URL: URL JDBC. Por defecto, la base local "medicamentos".
spring.datasource.url=${MEDICAMENTOS_DB_URL:jdbc:postgresql://localhost:5432/medicamentos}
# MEDICAMENTOS_DB_USER / MEDICAMENTOS_DB_PASSWORD: rol de la aplicación.
spring.datasource.username=${MEDICAMENTOS_DB_USER:medicamentos_app}
spring.datasource.password=${MEDICAMENTOS_DB_PASSWORD:}
# MEDICAMENTOS_DB_POOL: conexiones máximas del pool.
spring.datasource.hikari.maximum-pool-size=${MEDICAMENTOS_DB_POOL:10}
# Esperas cortas, por debajo de los 5 s de lectura de PachocloSystem: sin conexión
# libre en 3 s, o con una fila bloqueada más de 3 s, la petición falla (503) en vez
# de quedarse colgada.
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '3s'

# Flyway crea y actualiza el esquema al arrancar (src/main/resources/db/migration).
# Si la base no está disponible, el servicio no arranca.
spring.flyway.locations=classpath:db/migration

# Health checks para la plataforma de despliegue (Actuator). Solo se expone health,
# sin detalles: /actuator/health (todo, incluida la base de datos),
# /actuator/health/liveness (el proceso responde) y /actuator/health/readiness
# (puede atender peticiones: incluye la base de datos). DOWN responde 503.
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

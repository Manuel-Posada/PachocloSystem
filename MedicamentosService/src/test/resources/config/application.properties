# Configuración de los tests: se suma a src/main/resources/application.properties y
# solo cambia la base de datos. Los tests usan una base PROPIA, que vacían antes de
# cada prueba: su nombre debe terminar en "_test" (BaseDeDatosDePruebas lo comprueba).
# MEDICAMENTOS_TEST_DB_URL / _USER / _PASSWORD: sin contraseña por defecto en el repo.
spring.datasource.url=${MEDICAMENTOS_TEST_DB_URL:jdbc:postgresql://localhost:5432/medicamentos_test}
spring.datasource.username=${MEDICAMENTOS_TEST_DB_USER:medicamentos_app}
spring.datasource.password=${MEDICAMENTOS_TEST_DB_PASSWORD:}

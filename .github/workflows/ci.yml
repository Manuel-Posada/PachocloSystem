# Integración continua: pruebas de los dos servicios (contra PostgreSQL real) y del
# frontend (tests, lint, formato y build) en cada push, a cualquier rama, y en cada PR.
#
# Las bases de PostgreSQL son contenedores efímeros del propio job: su contraseña
# solo existe durante la ejecución y no protege ningún dato (no es un secreto).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pachoclosystem:
    name: PachocloSystem
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pachoclosystem_test
          POSTGRES_USER: pachoclosystem_app
          POSTGRES_PASSWORD: ci-postgres-efimero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pachoclosystem_app -d pachoclosystem_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PACHOCLOSYSTEM_TEST_DB_URL: jdbc:postgresql://localhost:5432/pachoclosystem_test
      PACHOCLOSYSTEM_TEST_DB_USER: pachoclosystem_app
      PACHOCLOSYSTEM_TEST_DB_PASSWORD: ci-postgres-efimero
    defaults:
      run:
        working-directory: PachocloSystem
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tests
        run: ./mvnw -B -ntp verify
      - name: Informes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pachoclosystem-surefire
          path: PachocloSystem/target/surefire-reports
          retention-days: 7

  medicamentos:
    name: MedicamentosService
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: medicamentos_test
          POSTGRES_USER: medicamentos_app
          POSTGRES_PASSWORD: ci-postgres-efimero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medicamentos_app -d medicamentos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MEDICAMENTOS_TEST_DB_URL: jdbc:postgresql://localhost:5432/medicamentos_test
      MEDICAMENTOS_TEST_DB_USER: medicamentos_app
      MEDICAMENTOS_TEST_DB_PASSWORD: ci-postgres-efimero
    defaults:
      run:
        working-directory: MedicamentosService
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tests
        run: ./mvnw -B -ntp verify
      - name: Informes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: medicamentos-surefire
          path: MedicamentosService/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test -- --watch=false
      - name: Lint
        run: npm run lint
      - name: Formato
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Build de Vercel (URL de ejemplo)
        run: npm run build:vercel
        env:
          API_BASE_URL: https://pachoclosystem.example.com

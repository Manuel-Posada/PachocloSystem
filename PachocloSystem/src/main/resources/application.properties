spring.application.name=pachoclosystem

# PORT: puerto HTTP (lo asigna la plataforma de despliegue). Por defecto: 8080.
server.port=${PORT:8080}

# Los errores de la API nunca incluyen trazas de pila, mensajes internos
# ni nombres de excepciones en la respuesta (solo van al log del servidor).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Usuario administrador inicial: se crea al arrancar si no existe en la base de datos.
# ADMIN_USERNAME: nombre de usuario del administrador. Por defecto: "admin".
app.admin.username=${ADMIN_USERNAME:admin}
# ADMIN_PASSWORD: contraseña en claro del administrador. Sin valor por defecto en el
# repo. Si está vacía, se genera una contraseña aleatoria temporal y se muestra UNA
# sola vez en el log (WARN); con el perfil prod es obligatoria para crearlo. Solo se aplica
# al crearlo. Ver README, sección "Variables de entorno del administrador inicial".
app.admin.password=${ADMIN_PASSWORD:}

# Zona horaria oficial de la aplicación (fecha de los registros clínicos),
# independiente de la del servidor. APP_ZONA_HORARIA: identificador
# IANA. Por defecto: America/Bogota. Una zona inválida impide arrancar.
app.zona-horaria=${APP_ZONA_HORARIA:America/Bogota}

# Tokens JWT (autenticación stateless con bearer token).
# JWT_SECRET: clave de firma HS256, mínimo 32 bytes (UTF-8). Sin valor por defecto
# en el repo: si está vacía, se genera una clave aleatoria temporal (WARN único) y
# los tokens no sobreviven a un reinicio. Ver README, sección "Autenticación (JWT)".
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracion-minutos=30
app.jwt.emisor=pachoclosystem

# Servicio de medicamentos (MedicamentosService, otro proceso). Ver README,
# sección "Integración con MedicamentosService".
# MEDICAMENTOS_URL: URL base sin barra final. Por defecto: http://localhost:8081.
medicamentos.url=${MEDICAMENTOS_URL:http://localhost:8081}
medicamentos.timeout-conexion=2s
medicamentos.timeout-lectura=5s
# MEDICAMENTOS_API_KEY: clave compartida con MedicamentosService (cabecera X-Api-Key).
# Debe ser la misma en los dos servicios. Vacía = no se envía.
medicamentos.api-key=${MEDICAMENTOS_API_KEY:}

# Claves Idempotency-Key de POST /api/pacientes/{id}/historial (en PostgreSQL): cuánto
# tiempo se recuerda cada una. Ver README, sección "Registros idempotentes (Idempotency-Key)".
historial.idempotencia.caducidad=24h

# Límite de intentos fallidos de login (estado en memoria; ver README).
# APP_LOGIN_MAX_INTENTOS: fallos de un usuario desde una misma IP que bloquean ese par.
app.login.max-intentos=${APP_LOGIN_MAX_INTENTOS:5}
# APP_LOGIN_MAX_INTENTOS_IP: fallos desde una IP, con cualquier usuario, que bloquean la IP.
app.login.max-intentos-ip=${APP_LOGIN_MAX_INTENTOS_IP:50}
# APP_LOGIN_MAX_INTENTOS_USUARIO: fallos de un usuario, desde cualquier IP, que bloquean la cuenta.
app.login.max-intentos-usuario=${APP_LOGIN_MAX_INTENTOS_USUARIO:100}
# APP_LOGIN_BLOQUEO_MINUTOS: ventana de conteo de fallos y duración del bloqueo.
app.login.bloqueo-minutos=${APP_LOGIN_BLOQUEO_MINUTOS:15}
# APP_LOGIN_MAX_ENTRADAS: tope de claves en memoria antes de purgar caducadas.
app.login.max-entradas=${APP_LOGIN_MAX_ENTRADAS:10000}
# APP_LOGIN_PROXIES_CONFIABLES: IPs o rangos CIDR (p. ej. 100.64.0.0/10) de los proxies
# inversos propios, separados por comas. Solo de ellos se acepta X-Forwarded-For.
# Vacío por defecto: se usa la IP del socket.
app.login.proxies-confiables=${APP_LOGIN_PROXIES_CONFIABLES:}

# CORS configurable por orígenes explícitos (ver README).
# CORS_ORIGENES: lista separada por comas de orígenes absolutos http(s) sin
# comodín. Vacío por defecto = sin CORS (ninguna cabecera Access-Control-Allow-*).
app.cors.origenes=${CORS_ORIGENES:}

# PostgreSQL (ver README, sección "Base de datos"). Sin contraseña por defecto en el repo.
# PACHOCLOSYSTEM_DB_URL: URL JDBC. Por defecto, la base local "pachoclosystem".
spring.datasource.url=${PACHOCLOSYSTEM_DB_URL:jdbc:postgresql://localhost:5432/pachoclosystem}
# PACHOCLOSYSTEM_DB_USER / PACHOCLOSYSTEM_DB_PASSWORD: rol de la aplicación.
spring.datasource.username=${PACHOCLOSYSTEM_DB_USER:pachoclosystem_app}
spring.datasource.password=${PACHOCLOSYSTEM_DB_PASSWORD:}
# PACHOCLOSYSTEM_DB_POOL: conexiones máximas del pool.
spring.datasource.hikari.maximum-pool-size=${PACHOCLOSYSTEM_DB_POOL:10}
# Esperas cortas: sin conexión libre en 3 s, o con una fila bloqueada más de 3 s,
# la petición responde 503 en vez de quedarse colgada.
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '3s'

# Flyway crea y actualiza el esquema al arrancar (src/main/resources/db/migration).
# Si la base no está disponible, el servicio no arranca.
spring.flyway.locations=classpath:db/migration

# Health checks para la plataforma de despliegue (Actuator). Solo se expone health,
# sin detalles: /actuator/health (todo, incluida la base de datos),
# /actuator/health/liveness (el proceso responde) y /actuator/health/readiness
# (puede atender peticiones: incluye la base de datos). DOWN responde 503.
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

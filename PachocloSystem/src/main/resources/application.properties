spring.application.name=pachoclosystem

# Los errores de la API nunca incluyen trazas de pila, mensajes internos
# ni nombres de excepciones en la respuesta (solo van al log del servidor).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Usuario administrador inicial (creado al arrancar, solo en memoria).
# ADMIN_USERNAME: nombre de usuario del administrador. Por defecto: "admin".
app.admin.username=${ADMIN_USERNAME:admin}
# ADMIN_PASSWORD: contraseña en claro del administrador. Sin valor por defecto en el
# repo. Si está vacía, se genera una contraseña aleatoria temporal y se muestra UNA
# sola vez en el log (WARN). Ver README, sección "Usuarios y roles (en memoria)".
app.admin.password=${ADMIN_PASSWORD:}

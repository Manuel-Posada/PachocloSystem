# Configuración de los tests: se suma a src/main/resources/application.properties
# (las claves de aquí tienen prioridad). Fija valores de PRUEBA y la base de datos
# de pruebas.
spring.application.name=pachoclosystem

# Los errores de la API nunca incluyen trazas de pila, mensajes internos
# ni nombres de excepciones en la respuesta (solo van al log del servidor).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Usuario administrador inicial (creado al arrancar si no existe).
app.admin.username=${ADMIN_USERNAME:admin}
# App.admin.password de PRUEBA (evidentemente falsa, solo para tests): se fija
# aquí para que el arranque de los contextos de test use una contraseña conocida
# y no se emita el WARN de contraseña aleatoria temporal en la salida de los tests.
app.admin.password=pwd-de-prueba-solo-tests-12345

# Tokens JWT (autenticación stateless con bearer token).
# Secreto de PRUEBA (evidentemente falso, 45 bytes >= 32): evita el WARN de clave
# aleatoria en los tests. La duración y el emisor coinciden con los de producción.
app.jwt.secret=clave-jwt-de-prueba-para-tests-1234567890abcd
app.jwt.expiracion-minutos=30
app.jwt.emisor=pachoclosystem

# Servicio de medicamentos: puerto cerrado para que ninguna prueba llegue por
# accidente a un servicio real (las pruebas usan mocks o esperan un 503).
medicamentos.url=http://127.0.0.1:1
medicamentos.timeout-conexion=500ms
medicamentos.timeout-lectura=1s
medicamentos.api-key=
# PostgreSQL de PRUEBA: una base propia. Cada contexto de Spring arranca con el
# esquema recreado (EsquemaLimpioEnTestsConfig) y los tests MockMvc la vacían antes
# de cada prueba. Su nombre debe terminar en "_test" (BaseDeDatosDePruebas lo
# comprueba antes de borrar nada). PACHOCLOSYSTEM_TEST_DB_URL / _USER / _PASSWORD:
# sin contraseña en el repo.
spring.datasource.url=${PACHOCLOSYSTEM_TEST_DB_URL:jdbc:postgresql://localhost:5432/pachoclosystem_test}
spring.datasource.username=${PACHOCLOSYSTEM_TEST_DB_USER:pachoclosystem_app}
spring.datasource.password=${PACHOCLOSYSTEM_TEST_DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=3000
# Cada contexto de test en caché tiene su propio pool: pocas conexiones y ninguna
# reservada en reposo, para no agotar max_connections de PostgreSQL.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '3s'
# Solo en tests: permite a Flyway recrear el esquema de la base de pruebas.
spring.flyway.clean-disabled=false

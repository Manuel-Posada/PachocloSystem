spring.application.name=pachoclosystem

# Los errores de la API nunca incluyen trazas de pila, mensajes internos
# ni nombres de excepciones en la respuesta (solo van al log del servidor).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Usuario administrador inicial (creado al arrancar, solo en memoria).
app.admin.username=${ADMIN_USERNAME:admin}
# App.admin.password de PRUEBA (evidentemente falsa, solo para tests): se fija
# aquí para que el arranque de los contextos de test use una contraseña conocida
# y no se emita el WARN de contraseña aleatoria temporal en la salida de los tests.
app.admin.password=pwd-de-prueba-solo-tests-12345

# Tokens JWT (autenticación stateless con bearer token).
# Secreto de PRUEBA (evidentemente falso, 45 bytes >= 32): evita el WARN de clave
# aleatoria en los tests. La duración y el emisor coinciden con los de producción.
app.jwt.secret=clave-jwt-de-prueba-para-tests-1234567890abcd
app.jwt.expiracion-minutos=30
app.jwt.emisor=pachoclosystem